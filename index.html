<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AI Core — 3D E-Mail Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='none' stroke='%2300ffd0' stroke-width='8'/><circle cx='50' cy='50' r='8' fill='%2300ffd0'/></svg>">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { overflow:hidden; background:#04070f; font-family:'Consolas','Courier New',monospace; color:#bcd8ff; user-select:none; -webkit-user-select:none; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  canvas { display:block; touch-action:none; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  .panel { position:relative; background:rgba(8,16,28,0.6); border:1px solid rgba(0,180,255,0.22); border-radius:8px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); box-shadow:inset 0 0 24px rgba(0,140,255,0.06), 0 4px 18px rgba(0,0,0,0.5); }
  .jarvis-corner::before, .jarvis-corner::after { content:''; position:absolute; width:12px; height:12px; pointer-events:none; }
  .jarvis-corner::before { top:-2px; left:-2px; border-top:2px solid rgba(0,190,255,0.8); border-left:2px solid rgba(0,190,255,0.8); border-top-left-radius:8px; }
  .jarvis-corner::after { bottom:-2px; right:-2px; border-bottom:2px solid rgba(0,190,255,0.8); border-right:2px solid rgba(0,190,255,0.8); border-bottom-right-radius:8px; }
  #titlePanel { position:absolute; top:18px; left:20px; padding:14px 20px; }
  #titlePanel h1 { font-size:20px; letter-spacing:6px; color:#8adcff; text-shadow:0 0 14px rgba(0,160,255,0.9); }
  #titlePanel p { font-size:10px; letter-spacing:3px; color:#6f8fb0; margin-top:5px; }
  #progressPanel { position:absolute; top:18px; left:50%; transform:translateX(-50%); width:min(360px,70vw); padding:12px 18px 10px; text-align:center; }
  #progressText { font-size:15px; letter-spacing:2px; color:#e6f4ff; }
  #progressBar { height:6px; background:rgba(0,160,255,0.12); border-radius:3px; overflow:hidden; margin-top:8px; }
  #progressBar > div { height:100%; width:0%; background:linear-gradient(90deg,#00d4ff,#3d9dff); box-shadow:0 0 10px rgba(0,180,255,0.9); transition:width 0.15s linear; }
  #stateText { font-size:10px; letter-spacing:3px; color:#00d4ff; margin-top:6px; min-height:12px; }
  #stateText.blink { animation:blink 0.8s steps(2,start) infinite; }
  @keyframes blink { to { visibility:hidden; } }
  #statsPanel { position:absolute; bottom:20px; left:20px; padding:12px 18px; font-size:11px; letter-spacing:1px; line-height:2; }
  #statsPanel .row { color:#8fb4d8; }
  #statsPanel .row span { color:#d6f2ff; }
  #legendPanel { position:absolute; bottom:20px; right:20px; padding:10px 16px; font-size:10px; letter-spacing:1px; line-height:2; color:#8fb4d8; }
  #legendPanel .legend-item { display:flex; align-items:center; gap:8px; }
  #legendPanel .dot { width:8px; height:8px; border-radius:50%; display:inline-block; box-shadow:0 0 6px currentColor; }
  #controlsPanel { position:absolute; top:70px; right:20px; width:230px; padding:12px 14px; pointer-events:auto; }
  .controls-header { display:flex; justify-content:space-between; align-items:center; }
  .controls-header span { font-size:11px; letter-spacing:3px; color:#8adcff; }
  #controlsToggle { background:none; border:1px solid rgba(0,180,255,0.22); color:#8adcff; width:22px; height:22px; border-radius:4px; cursor:pointer; font-size:13px; line-height:1; }
  #controlsToggle:hover { background:rgba(0,180,255,0.15); }
  #controlsBody { margin-top:8px; }
  #controlsBody label { display:flex; justify-content:space-between; font-size:10px; letter-spacing:1px; color:#8fb4d8; margin-top:8px; }
  #controlsBody label span { color:#d6f2ff; }
  #controlsBody input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:4px; margin-top:3px; background:rgba(0,160,255,0.15); border-radius:2px; outline:none; }
  #controlsBody input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:12px; height:12px; border-radius:50%; background:#00d4ff; box-shadow:0 0 8px rgba(0,180,255,0.9); cursor:pointer; border:none; }
  #controlsBody input[type=range]::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:#00d4ff; border:none; box-shadow:0 0 8px rgba(0,180,255,0.9); cursor:pointer; }
  #restartBtn { position:absolute; top:18px; right:20px; pointer-events:auto; background:rgba(8,16,28,0.6); border:1px solid rgba(0,180,255,0.22); color:#8adcff; font-family:inherit; font-size:11px; letter-spacing:3px; padding:10px 16px; border-radius:8px; cursor:pointer; transition:all .2s; }
  #restartBtn:hover { background:rgba(0,180,255,0.15); box-shadow:0 0 16px rgba(0,180,255,0.4); }
  #restartBtn:disabled { opacity:0.4; cursor:default; animation:none; }
  #restartBtn:not(:disabled) { animation:btnPulse 2s infinite; }
  @keyframes btnPulse { 0%,100% { box-shadow:0 0 8px rgba(0,180,255,0.25); } 50% { box-shadow:0 0 22px rgba(0,180,255,0.7); } }
  #tooltip { position:fixed; display:none; z-index:20; pointer-events:none; background:rgba(4,12,20,0.92); border:1px solid rgba(0,190,255,0.35); border-radius:6px; padding:8px 12px; font-size:11px; line-height:1.7; box-shadow:0 0 16px rgba(0,160,255,0.2); white-space:nowrap; }
  #tooltip .tt-name { color:#d6f2ff; }
  #scanlines { position:fixed; inset:0; pointer-events:none; z-index:6; background:repeating-linear-gradient(0deg, rgba(40,100,180,0.05) 0px, rgba(40,100,180,0.05) 1px, transparent 1px, transparent 3px); }
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:5; background:radial-gradient(ellipse at center, transparent 50%, rgba(0,4,16,0.75) 100%); }
  /* Mobile layout */
  @media (max-width: 700px){
    #titlePanel { top:8px; left:8px; padding:8px 12px; }
    #titlePanel h1 { font-size:14px; letter-spacing:3px; }
    #titlePanel p { font-size:8px; letter-spacing:2px; }
    #progressPanel { top:8px; width:58vw; padding:8px 10px; }
    #progressText { font-size:12px; }
    #stateText { font-size:8px; letter-spacing:2px; }
    #restartBtn { top:8px; right:8px; padding:8px 12px; font-size:9px; letter-spacing:2px; }
    #controlsPanel { top:58px; right:8px; width:170px; padding:10px 12px; }
    #controlsBody label { font-size:9px; }
    #statsPanel { bottom:8px; left:8px; padding:8px 12px; font-size:9px; line-height:1.8; }
    #legendPanel { display:none; }
    #tooltip { font-size:10px; }
  }
</style>
</head>
<body>
<div id="hud">
  <div class="panel jarvis-corner" id="titlePanel">
    <h1>AI CORE</h1>
    <p>HOLOGRAPHIC E-MAIL SORTING SYSTEM</p>
  </div>
  <div class="panel jarvis-corner" id="progressPanel">
    <div id="progressText">0 / 588</div>
    <div id="progressBar"><div></div></div>
    <div id="stateText">READY &mdash; PRESS DOWNLOAD</div>
  </div>
  <button id="restartBtn">&#9654; DOWNLOAD</button>
  <div class="panel" id="statsPanel">
    <div class="row">TIME&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span id="elapsedText">0.0s</span></div>
    <div class="row">RATE&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span id="rateText">0.0</span> files/s</div>
    <div class="row">FILES&nbsp;&nbsp;&nbsp;&nbsp;<span id="pointsText">588</span></div>
  </div>
  <div class="panel" id="legendPanel">
    <div class="legend-item"><span class="dot" style="background:#4a6a8a;color:#4a6a8a"></span>NOT DOWNLOADED</div>
    <div class="legend-item"><span class="dot" style="background:#00fff2;color:#00fff2"></span>DOWNLOADED</div>
    <div class="legend-item"><span class="dot" style="background:#9fffee;color:#9fffee"></span>SORTED</div>
    <div class="legend-item"><span class="dot" style="background:#ff3355;color:#ff3355"></span>PROCESSING FAIL</div>
  </div>
  <div class="panel" id="controlsPanel">
    <div class="controls-header">
      <span>CONTROLS</span>
      <button id="controlsToggle" title="Collapse/Expand">&minus;</button>
    </div>
    <div id="controlsBody">
      <label>BLOOM STRENGTH <span id="valStrength">0.30</span></label>
      <input type="range" id="ctlStrength" min="0" max="3" step="0.01" value="0.3">
      <label>BLOOM RADIUS <span id="valRadius">0.13</span></label>
      <input type="range" id="ctlRadius" min="0" max="2" step="0.01" value="0.13">
      <label>BLOOM THRESHOLD <span id="valThreshold">0.60</span></label>
      <input type="range" id="ctlThreshold" min="0" max="1" step="0.01" value="0.6">
      <label>BRIGHTNESS <span id="valExposure">1.19</span></label>
      <input type="range" id="ctlExposure" min="0.4" max="2" step="0.01" value="1.19">
      <label>CORE GLOW <span id="valCoreGlow">1.59</span></label>
      <input type="range" id="ctlCoreGlow" min="0.2" max="3" step="0.01" value="1.59">
      <label>POINT GLOW <span id="valPointGlow">0.90</span></label>
      <input type="range" id="ctlPointGlow" min="0.2" max="3" step="0.01" value="0.9">
    </div>
  </div>
</div>
<div id="tooltip"></div>
<div id="scanlines"></div>
<div id="vignette"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= Renderer ================= */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0 && innerWidth < 800);
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.19;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 3, 15); // Start so weit draussen, dass alles sichtbar ist

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 15; // never closer -> the whole sphere is always visible
controls.maxDistance = 24;

/* ================= Environment + Lights ================= */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

scene.add(new THREE.AmbientLight(0x404060, 1.1));
const keyLight = new THREE.PointLight(0xffffff, 150, 50, 2);
keyLight.position.set(5, 8, 6);
scene.add(keyLight);

/* ================= AI Core (kristallin, Protoss) ================= */
const CORE_LIGHT_BASE     = 60;
const CORE_LIGHT_PULSE    = 35;
const coreMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uGlow: { value: 1.59 },
    uColor: { value: new THREE.Color(0x00eaff) }
  },
  vertexShader: `
    varying vec3 vN; varying vec3 vV; varying vec3 vPos;
    void main(){
      vN = normalize(normalMatrix * normal);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vV = normalize(-mv.xyz);
      vPos = position;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform float uTime, uGlow;
    uniform vec3 uColor;
    varying vec3 vN; varying vec3 vV; varying vec3 vPos;
    void main(){
      float fresnel = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 3.0);
      // highlight facet edges (crystal look)
      float edge = smoothstep(0.4, 0.5, fresnel);
      // energy veins: pulsing lines across the surface
      float veins = sin(vPos.x*8.0 + uTime*2.0) * sin(vPos.y*8.0 - uTime*1.5) * sin(vPos.z*8.0 + uTime);
      veins = smoothstep(0.85, 1.0, veins);
      vec3 col = uColor * (0.3 + fresnel*1.4 + edge*1.5 + veins*2.0) * uGlow;
      gl_FragColor = vec4(col, 1.0);
    }`,
  transparent: false
});
const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 2), coreMat);
scene.add(core);
const coreLight = new THREE.PointLight(0x00eaff, CORE_LIGHT_BASE, 30, 2);
core.add(coreLight);

/* ================= Positions ================= */
const TOTAL = 588;
const SHELL_RADIUS = 5;
const CENTER = new THREE.Vector3(0, 0, 0);

function fibonacciSphere(samples, radius){
  const pts = [];
  const phi = Math.PI * (3 - Math.sqrt(5)); // goldener Winkel
  for (let i = 0; i < samples; i++){
    const y  = 1 - (i / (samples - 1)) * 2;
    const r  = Math.sqrt(Math.max(0, 1 - y*y));
    const th = phi * i;
    pts.push(new THREE.Vector3(Math.cos(th)*r*radius, y*radius, Math.sin(th)*r*radius));
  }
  return pts;
}
// Perfect sphere = final result (sorted)
const perfectPositions = fibonacciSphere(TOTAL, SHELL_RADIUS);

// Fully random 3D cloud for the start (not downloaded)
const randomPositions = [];
function scatterPositions(){
  for (let i = 0; i < TOTAL; i++){
    // random point evenly distributed in the sphere volume (no perfect shell!)
    const r = SHELL_RADIUS * (0.55 + 0.75 * Math.cbrt(Math.random()));
    randomPositions[i] = new THREE.Vector3().randomDirection().multiplyScalar(r);
  }
}
scatterPositions();

/* ================= Points (InstancedMesh + hologram shader) ================= */
// Shader with sphere shading + fresnel rim -> 3D hologram instead of flat plates
const pointMat = new THREE.ShaderMaterial({
  uniforms: { uGlow: { value: 0.9 } },
  vertexShader: `
    #include <common>
    #include <color_pars_vertex>
    varying vec3 vN;
    varying vec3 vV;
    varying vec3 vCol;
    void main(){
      #include <begin_vertex>
      #include <color_vertex>
      #include <project_vertex>
      vN = normalize(normalMatrix * normal);
      vV = normalize(-mvPosition.xyz);
      vCol = vColor;
    }
  `,
  fragmentShader: `
    uniform float uGlow;
    varying vec3 vN;
    varying vec3 vV;
    varying vec3 vCol;
    void main(){
      float ndv = abs(dot(normalize(vN), normalize(vV)));
      float fresnel = pow(1.0 - ndv, 2.5);
      float shade = mix(0.25, 1.0, ndv);
      vec3 col = vCol * (shade + fresnel * 1.8) * uGlow;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});
const pointField = new THREE.InstancedMesh(new THREE.SphereGeometry(0.12, 16, 16), pointMat, TOTAL);
pointField.frustumCulled = false;
const dummy = new THREE.Object3D();
function setInstance(i, pos, scale){
  dummy.position.copy(pos);
  dummy.scale.setScalar(scale);
  dummy.updateMatrix();
  pointField.setMatrixAt(i, dummy.matrix);
}
// Jeder Punkt bekommt eine eigene Umlaufbahn + eigene Geschwindigkeit (nicht starr)
const orbitAxes = [];
const orbitSpeeds = [];
const orbitAxisTmp = new THREE.Vector3();
for (let i = 0; i < TOTAL; i++){
  orbitAxes[i] = new THREE.Vector3().randomDirection();
  orbitSpeeds[i] = 0.05 + Math.random() * 0.25;
}
function setInstanceOrbiting(i, basePos, scale, t){
  dummy.position.copy(basePos);
  orbitAxisTmp.copy(orbitAxes[i]);
  dummy.position.applyAxisAngle(orbitAxisTmp, orbitSpeeds[i] * t);
  dummy.scale.setScalar(scale);
  dummy.updateMatrix();
  pointField.setMatrixAt(i, dummy.matrix);
}
const orbitScratch = new THREE.Vector3();
function orbitPosition(i, basePos, t){
  orbitScratch.copy(basePos);
  orbitAxisTmp.copy(orbitAxes[i]);
  orbitScratch.applyAxisAngle(orbitAxisTmp, orbitSpeeds[i] * t);
  return orbitScratch;
}
for (let i = 0; i < TOTAL; i++) setInstance(i, randomPositions[i], 0);
pointField.instanceMatrix.needsUpdate = true;

// 3 states (Protoss cyan palette): STEEL BLUE = not downloaded | CYAN = downloaded | ICE WHITE = sorted | RED = fail
const COLOR_GRAY  = new THREE.Color(0x4a6a8a).multiplyScalar(2.0);
const COLOR_GREEN = new THREE.Color(0x00fff2).multiplyScalar(4.0); // pure cyan
const COLOR_CYAN  = new THREE.Color(0x9fffee).multiplyScalar(4.5); // fast weisses Cyan
const COLOR_FAIL  = new THREE.Color(0xff3355).multiplyScalar(4.0);
const COLOR_FLASH = new THREE.Color(0xeafffb).multiplyScalar(3.0); // near-white flash

// ~7% of files fail during processing -> red at the end
const failFlags = new Array(TOTAL).fill(false);
let failCount = 0;
function pickFails(){
  failFlags.fill(false);
  const n = Math.max(1, Math.floor(TOTAL * 0.07));
  let picked = 0;
  while (picked < n){
    const i = Math.floor(Math.random() * TOTAL);
    if (!failFlags[i]){ failFlags[i] = true; picked++; }
  }
  failCount = n;
}
pickFails();
for (let i = 0; i < TOTAL; i++) pointField.setColorAt(i, COLOR_GRAY);
pointField.instanceColor.needsUpdate = true;
scene.add(pointField);

/* ================= Jarvis-Hologramm (Frames, Orbits, Grid) ================= */
function makeHoloSphere(radius, opacity){
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 32, 20),
    new THREE.MeshBasicMaterial({
      color: new THREE.Color(0x1e8fff).multiplyScalar(1.6),
      wireframe: true,
      transparent: true,
      opacity: opacity,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    })
  );
  mesh.frustumCulled = false;
  scene.add(mesh);
  return mesh;
}
const holoOuter = makeHoloSphere(5.4, 0.10); // hologram sphere around the whole system
const holoInner = makeHoloSphere(1.4, 0.35);  // hologram frame around the core

function makeCircleRing(radius, opacity){
  const pts = [];
  for (let i = 0; i <= 72; i++){
    const a = (i / 72) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius));
  }
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({
      color: new THREE.Color(0x00c8ff).multiplyScalar(1.6),
      transparent: true,
      opacity: opacity,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    })
  );
  line.frustumCulled = false;
  scene.add(line);
  return line;
}
const orbit1 = makeCircleRing(2.4, 0.45); // gyroscope rings (Jarvis orbits)
const orbit2 = makeCircleRing(3.5, 0.3);
const orbit3 = makeCircleRing(4.6, 0.2);
orbit1.rotation.x = 1.25;
orbit2.rotation.x = 1.65; orbit2.rotation.z = 0.7;
orbit3.rotation.x = 0.85; orbit3.rotation.z = 1.15;
// tight analyzer rings around the core (only visible during processing)
const analyzer1 = makeCircleRing(1.45, 0);
const analyzer2 = makeCircleRing(1.95, 0);
analyzer1.rotation.x = 0.55;
analyzer2.rotation.x = 1.15; analyzer2.rotation.z = 0.6;
// crystalline shield panel (counter-rotating to the rings)
function makeShieldPanel(radius, opacity){
  const geo = new THREE.IcosahedronGeometry(radius, 1);
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(0x00eaff),
    wireframe: true,
    transparent: true,
    opacity: opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  scene.add(mesh);
  return mesh;
}
const shieldPanel = makeShieldPanel(1.7, 0.4);

function createPolarGrid(){
  const group = new THREE.Group();
  const mat = new THREE.LineBasicMaterial({
    color: new THREE.Color(0x1e8fff).multiplyScalar(1.3),
    transparent: true,
    opacity: 0.18,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  for (let r = 1; r <= 7; r++){
    const pts = [];
    for (let i = 0; i <= 64; i++){
      const a = (i / 64) * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a)*r, 0, Math.sin(a)*r));
    }
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat);
    line.frustumCulled = false;
    group.add(line);
  }
  for (let k = 0; k < 24; k++){
    const a = (k / 24) * Math.PI * 2;
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(Math.cos(a)*7, 0, Math.sin(a)*7)
      ]), mat);
    line.frustumCulled = false;
    group.add(line);
  }
  group.position.y = -5.4;
  scene.add(group);
  return group;
}
const polarGrid = createPolarGrid();

/* ================= Floating data texts (only during processing, small & close to the core) ================= */
const TEXT_PHRASES = [
  'OCR', 'PARSE', 'INDEX', 'HASH', 'AES-256', 'SHA-1', 'TLS', 'SYNC',
  'STREAM', 'CACHE', 'QUEUE', 'SORT', 'SCAN', 'ENCODE', 'DECODE', 'MATCH',
  '0x4F2A', '0xB8D1', '0x9C7E', '#A3C1FF', '#00D4FF', '#7FD0FF',
  '42 KB', '1.3 MB', '256 b/s', '512 b/s', 'x:0.42', 'y:1.13',
  '87%', '99.9%', '45.2%', '128 bit', 'SHA-256', 'AES-128'
];
const TEXT_COLORS = ['#a9e2ff', '#7fd0ff', '#ffffff', '#00d4ff'];

function makeUnderlineTexture(){
  const c = document.createElement('canvas');
  c.width = 64; c.height = 16;
  const ctx = c.getContext('2d');

let lastScrambleTime = -1;
function updateFloatTexts(now){
  const inProcess = phase === PHASE_PROCESS;
  const pulling = phase === PHASE_PAUSE;
  let target = 0;
  let s = 1;
  let fade = 1;
  if (inProcess){
    target = 0.9;
  } else if (pulling){
    target = 0.9;
    // quickly pull the formulas into the core (first 0.35s of the pause)
    const pullT = Math.min(1, (now - pauseStart) / 0.35);
    s = 1 - easeInCubic(pullT);
    // 200ms rhythm: formulas scramble into other texts
    if (now - lastScrambleTime > 0.2){
      for (const ft of floatTexts){
        ft.setText(TEXT_PHRASES[Math.floor(Math.random() * TEXT_PHRASES.length)]);
      }
      lastScrambleTime = now;
    }
    // fade out right before the explosion
    fade = 1 - Math.max(0, (now - pauseStart - 0.65) / 0.35);
  }
  for (const ft of floatTexts){
    const a = ft.phase + ft.speed * now;
    const px = Math.cos(a) * ft.radius * s;
    const py = (ft.y + Math.sin(now * ft.bobSpeed + ft.phase) * 0.35) * s;
    const pz = Math.sin(a) * ft.radius * s;
    ft.sprite.position.set(px, py, pz);
    ft.underline.position.set(px, py - ft.base * 0.22 * s, pz);
    // leader line core -> label (moves along)
    const posArr = ft.line.geometry.attributes.position.array;
    posArr[3] = px; posArr[4] = py; posArr[5] = pz;
    ft.line.geometry.attributes.position.needsUpdate = true;

    const pulse = 0.75 + 0.25 * Math.sin(now * 1.6 + ft.phase * 3);
    const o = target * fade * pulse;
    ft.sprite.material.opacity += (o - ft.sprite.material.opacity) * 0.12;
    ft.underline.material.opacity += (o * 0.8 - ft.underline.material.opacity) * 0.12;
    ft.line.material.opacity += (o * 0.6 - ft.line.material.opacity) * 0.12;
  }
}

  particles.push({

function updateParticles(dt){
  if (!particles.length){ pGeo.setDrawRange(0, 0); return; }
  let maxSlot = 0;
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.t += dt;
    if (p.t >= p.life){ freeSlots.push(p.slot); particles.splice(i, 1); continue; }
    const u = p.t / p.life;
    const fade = 1 - u;
    const ang = p.phase + p.angSpeed * p.t * p.dir;
    const bob = Math.sin(p.t * 2.2 + p.phase) * 0.22;
    pPos.setXYZ(p.slot,
      Math.cos(ang) * p.radius,
      p.y + bob * fade,
      Math.sin(ang) * p.radius);
    pCol.setXYZ(p.slot, pBaseColor.r*fade, pBaseColor.g*fade, pBaseColor.b*fade);
    if (p.slot > maxSlot) maxSlot = p.slot;
  }
  pGeo.setDrawRange(0, maxSlot + 1);
  pPos.needsUpdate = true;
  pCol.needsUpdate = true;
}

/* ================= Phasen & Timing ================= */
const PHASE_IDLE = -1, PHASE_SCAN = 0, PHASE_DOWNLOAD = 1, PHASE_PROCESS = 2, PHASE_PAUSE = 3, PHASE_EXPLODE = 4, PHASE_COMPLETE = 5, PHASE_DOCS = 6;

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
let downloadOrder = shuffle([...Array(TOTAL).keys()]);
const pullStart = new Array(TOTAL).fill(-1);
const explodeDelay = new Array(TOTAL).fill(0);
const scanned = new Array(TOTAL).fill(false); // flash when appearing
const impactDone = new Array(TOTAL).fill(false); // wave already triggered?

function resetTimers(){
  cycleStart    = performance.now() / 1000;
  downloadStart = cycleStart + SCAN_DURATION; // kein Gap -> kein Freeze am Uebergang
  processStart  = downloadStart + TOTAL / FILES_PER_SECOND + PULL_DURATION;
  pauseStart    = processStart + PROCESS_DURATION;
  explodeStart  = pauseStart + PAUSE_DURATION;
  completeStart = explodeStart + EXPLODE_DURATION + 0.5;
}
resetTimers();

function computePhase(now){
  if (now < downloadStart) return PHASE_SCAN;
  if (now < processStart)  return PHASE_DOWNLOAD;
  if (now < pauseStart)    return PHASE_PROCESS;
  if (now < explodeStart)  return PHASE_PAUSE;
  if (now < completeStart) return PHASE_EXPLODE;
  return PHASE_COMPLETE;
}

function easeOutBack(t){
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function easeInCubic(t){ return t*t*t; }
function easeOutCubic(t){ const u = 1 - t; return 1 - u*u*u; }

/* ================= Phase 1: Scan - finding e-mails (points appear) ================= */
function updateScan(now){
  if (phase !== PHASE_SCAN || appearFinished) return;
  const elapsed = now - cycleStart;
  if (elapsed >= SCAN_DURATION){
    for (let i = 0; i < TOTAL; i++){
      if (!scanned[i]){
        scanned[i] = true;
        pointField.setColorAt(i, COLOR_FLASH);
        animateColor(i, COLOR_FLASH, COLOR_GRAY, 0.3);
      }
      setInstanceOrbiting(i, randomPositions[i], 1, timeNow - cycleStart);
    }
    pointField.instanceMatrix.needsUpdate = true;
    appearFinished = true;
    return;
  }
  for (let i = 0; i < TOTAL; i++){
    const delay = (i / TOTAL) * (SCAN_DURATION - POP_DURATION); // last pop ends exactly at the end of the scan
    const local = (elapsed - delay) / POP_DURATION;
    if (local <= 0) continue;
    if (!scanned[i]){
      scanned[i] = true;
      pointField.setColorAt(i, COLOR_FLASH);
      animateColor(i, COLOR_FLASH, COLOR_GRAY, 0.3);
    }
    setInstanceOrbiting(i, randomPositions[i], easeOutBack(Math.min(local, 1)), timeNow - cycleStart);
  }
  pointField.instanceMatrix.needsUpdate = true;
}

/* ================= Phase 2: Download - points are pulled in randomly ================= */
function updateDownloads(now){
  if (phase !== PHASE_DOWNLOAD) return;
  const kMax = Math.min(TOTAL, Math.floor((now - downloadStart) * FILES_PER_SECOND) + 1);
  for (let k = 0; k < kMax; k++){
    const idx = downloadOrder[k];
    if (pullStart[idx] < 0){
      pullStart[idx] = downloadStart + k / FILES_PER_SECOND;
      pointField.setColorAt(idx, COLOR_FLASH);           // flash
      animateColor(idx, COLOR_FLASH, COLOR_GREEN, 0.35); // -> green
    }
  }
  downloadedCount = kMax;
}

/* ================= Per-frame point positions ================= */
function updatePointTransforms(now){
  if (phase === PHASE_IDLE || phase === PHASE_SCAN || phase === PHASE_DOCS) return; // IDLE/DOCS handled separately
  for (let i = 0; i < TOTAL; i++){
    if (phase === PHASE_DOWNLOAD){
      const s = pullStart[i];
      if (s < 0){ setInstanceOrbiting(i, randomPositions[i], 1, timeNow - cycleStart); continue; }
      const t = (now - s) / PULL_DURATION;
      if (t >= 1){
        if (!impactDone[i]){
          impactDone[i] = true;
          spawnImpactWave(timeNow, randomPositions[i]); // impact wave when sucked in
        }
        setInstance(i, CENTER, 0);
        continue;
      }
      const e = easeInCubic(t);
      // spiral into the core from the (still orbiting) point
      dummy.position.copy(orbitPosition(i, randomPositions[i], timeNow - cycleStart)).multiplyScalar(1 - e);
      dummy.scale.setScalar(1 - e * 0.95);
      dummy.updateMatrix();
      pointField.setMatrixAt(i, dummy.matrix);
    } else {
      // PROCESS / EXPLODE / COMPLETE
      const d = explodeDelay[i];
      const t = (now - explodeStart - d) / EXPLODE_DURATION;
      if (t <= 0){ setInstance(i, CENTER, 0); continue; }
      if (t >= 1){ setInstance(i, perfectPositions[i], 1); continue; } // sorted = static
      const e = easeOutCubic(t);
      dummy.position.copy(perfectPositions[i]).multiplyScalar(e);
      dummy.scale.setScalar(Math.max(0.02, easeOutBack(t)));
      dummy.updateMatrix();
      pointField.setMatrixAt(i, dummy.matrix);
    }
  }
  pointField.instanceMatrix.needsUpdate = true;
}

    pts.push(new THREE.Vector3(Math.cos(a), 0, Math.sin(a)));
  }
  return new THREE.BufferGeometry().setFromPoints(pts);
})();
const impactWaveBaseMat = new THREE.LineBasicMaterial({
  color: new THREE.Color(0x9fffee).multiplyScalar(2.5),
  transparent: true,
  opacity: 0,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const upVec = new THREE.Vector3(0, 1, 0);
const impactWaves = [];
for (let i = 0; i < IMPACT_POOL; i++){
  const line = new THREE.Line(impactWaveGeo, impactWaveBaseMat.clone());
  line.frustumCulled = false;
  line.visible = false;
  scene.add(line);
  impactWaves.push({ line, active: false, t0: 0 });
}
function spawnImpactWave(now, dir){
  const w = impactWaves.find(w => !w.active);
  if (!w) return;
  const d = dir.clone().normalize();
  w.active = true;
  w.t0 = now;
  w.line.visible = true;
  if (Math.abs(d.y) > 0.99){
    w.line.quaternion.identity();
    w.line.rotation.x = d.y > 0 ? 0 : Math.PI;
  } else {
    w.line.quaternion.setFromUnitVectors(upVec, d);
  }
  w.line.scale.setScalar(1.05);
  w.line.material.opacity = 0.85;
}
function updateImpactWaves(now){
  for (const w of impactWaves){
    if (!w.active) continue;
    const t = (now - w.t0) / 0.4;
    if (t >= 1){
      w.active = false;
      w.line.visible = false;
      w.line.material.opacity = 0;
      continue;
    }
    w.line.scale.setScalar(1.05 + t * 0.95);
    w.line.material.opacity = 0.85 * Math.pow(1 - t, 2); // smooth ease-out fade
  }
}

/* ================= Comment & Upload (per sphere, sequential) ================= */
function updateDocs(now){
  if (phase !== PHASE_DOCS) return;
  docIndex = Math.min(TOTAL, Math.floor((now - docStart) * DOCS_PER_SECOND));
  docsFinished = docIndex >= TOTAL;

  // point in front of the camera (center of view, closer)
  camera.getWorldDirection(camDir);
  camFocus.copy(camera.position).addScaledVector(camDir, 3.5);

  for (let i = 0; i < TOTAL; i++){
    const t = now - (docStart + i / DOCS_PER_SECOND);
    if (t < 0){
      // not yet processed: stays on the sorted sphere
      setInstance(i, perfectPositions[i], 1);
      continue;
    }
    if (t >= DOCS_SPHERE_DUR){
      // done: sphere is gone
      setInstance(i, CENTER, 0);
      continue;
    }
    // active sphere: focus -> blue (comment) -> green (upload) -> explosion
    let col;
    if (t < FOCUS_DUR){
      const f = easeOutCubic(t / FOCUS_DUR);
      dummy.position.copy(perfectPositions[i]).lerp(camFocus, f);
      dummy.scale.setScalar(1 + 2 * f);
      col = DOC_FOCUS;
    } else if (t < FOCUS_DUR + BLUE_DUR){
      dummy.position.copy(camFocus);
      dummy.scale.setScalar(3);
      col = DOC_BLUE;
    } else if (t < FOCUS_DUR + BLUE_DUR + GREEN_DUR){
      dummy.position.copy(camFocus);
      dummy.scale.setScalar(3);
      col = DOC_GREEN;
    } else {
      const f = (t - (FOCUS_DUR + BLUE_DUR + GREEN_DUR)) / POP_DUR;
      dummy.position.copy(camFocus);
      dummy.scale.setScalar(3 + f * 2);
      col = DOC_FLASH;
    }
    dummy.updateMatrix();
    pointField.setMatrixAt(i, dummy.matrix);
    pointField.setColorAt(i, col);
  }
  pointField.instanceMatrix.needsUpdate = true;
  pointField.instanceColor.needsUpdate = true;
}

/* ================= Hover-Tooltips ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let px = 0, py = 0, hasPointer = false;
addEventListener('pointermove', (e) => {
  px = e.clientX; py = e.clientY;
  hasPointer = true;
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
});
const tooltipEl = document.getElementById('tooltip');
function hoverEnabled(now){
  if (phase === PHASE_SCAN) return appearFinished;
  if (phase === PHASE_COMPLETE) return true;
  return false;
}
function updateHover(now){
  if (!hasPointer || !hoverEnabled(now)){ tooltipEl.style.display = 'none'; return; }
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(pointField, false);
  if (hits.length && hits[0].instanceId !== undefined){
    const id = hits[0].instanceId;
    const meta = fileMeta[id];
    let status = 'NOT DOWNLOADED', col = '#4a6a8a';
    if (phase === PHASE_COMPLETE){
      if (failFlags[id]){ status = 'PROCESSING FAIL'; col = '#ff3355'; }
      else { status = 'SORTED'; col = '#9fffee'; }
    }
    tooltipEl.innerHTML =
      '<div class="tt-name">' + meta.name + '</div>' +
      '<div class="tt-meta"><span style="color:' + col + '">&#9679; ' + status + '</span> &nbsp;|&nbsp; ' + meta.size + ' MB</div>';
    tooltipEl.style.display = 'block';
    tooltipEl.style.left = Math.min(px + 16, innerWidth  - tooltipEl.offsetWidth  - 10) + 'px';
    tooltipEl.style.top  = Math.min(py + 18, innerHeight - tooltipEl.offsetHeight - 10) + 'px';
    document.body.style.cursor = 'pointer';
  } else {
    tooltipEl.style.display = 'none';
    document.body.style.cursor = 'default';
  }
}

/* ================= HUD ================= */
const progressText = document.getElementById('progressText');
const progressBar  = document.getElementById('progressBar').firstElementChild;
const stateText    = document.getElementById('stateText');
const elapsedText  = document.getElementById('elapsedText');
const rateText     = document.getElementById('rateText');
const rateWindow = [];
function updateHUD(now){
  const elapsed = now - cycleStart;

  // During scan the e-mails are "found" (counter counts up)
  if (phase === PHASE_SCAN){
    const sp = Math.max(0, (now - cycleStart) / SCAN_DURATION);
    foundCount = Math.min(TOTAL, Math.floor(sp * TOTAL) + 1);
  }

  let dispCount = 0;
  if (phase === PHASE_SCAN) dispCount = foundCount;
  else if (phase === PHASE_DOCS) dispCount = docIndex;
  else dispCount = downloadedCount;

  progressText.textContent = phase === PHASE_IDLE ? '0 / ?' : dispCount + ' / ' + TOTAL;
  progressBar.style.width = (phase === PHASE_IDLE ? 0 : (dispCount / TOTAL * 100)).toFixed(2) + '%';
  elapsedText.textContent = phase === PHASE_IDLE ? '0.0s' : elapsed.toFixed(1) + 's';

  let state = 'READY — PRESS DOWNLOAD';
  if (phase === PHASE_SCAN) state = 'SCANNING — FINDING E-MAILS\u2026';
  else if (phase === PHASE_DOWNLOAD) state = 'DOWNLOADING — ' + downloadedCount + ' / ' + TOTAL;
  else if (phase === PHASE_PROCESS){
    const proc = Math.min(1, (now - processStart) / PROCESS_DURATION);
    let step = 'OCR DETECTION';
    if (proc > 0.33) step = 'TEXT PARSING';
    if (proc > 0.66) step = 'METADATA INDEXING';
    state = step + ' \u2014 ' + Math.min(99, Math.floor(proc * 100)) + '%';
  }
  else if (phase === PHASE_PAUSE) state = 'PROCESSING COMPLETE — GETTING READY';
  else if (phase === PHASE_EXPLODE) state = 'SORTED — PERFECT SPHERE';
  else if (phase === PHASE_COMPLETE) state = 'DONE — ALL E-MAILS PROCESSED (' + failCount + ' FAILS)';
  else if (phase === PHASE_DOCS) state = docsFinished ? 'COMPLETE — ALL ' + TOTAL + ' DOCUMENTS UPLOADED' : 'COMMENT & UPLOAD \u2014 ' + docIndex + ' / ' + TOTAL;
  stateText.textContent = state;
  stateText.classList.toggle('blink', phase === PHASE_DOWNLOAD || phase === PHASE_PROCESS);

  // Button: DOWNLOAD im Standby, COMMENT & UPLOAD nach Abschluss, RESTART nach Upload
  const docsDone = phase === PHASE_DOCS && docsFinished;
  const running = phase !== PHASE_IDLE && phase !== PHASE_COMPLETE && !docsDone;
  restartBtn.disabled = running;
  if (!running){
    if (phase === PHASE_COMPLETE) restartBtn.textContent = '\u25B6 COMMENT & UPLOAD';
    else if (phase === PHASE_DOCS) restartBtn.textContent = '\u25B6 RESTART';
    else restartBtn.textContent = '\u25B6 DOWNLOAD';
  } else {
    restartBtn.textContent = 'RUNNING\u2026';
  }

  if (phase === PHASE_DOWNLOAD){
    rateWindow.push({ t: now, c: downloadedCount });
    while (rateWindow.length > 1 && rateWindow[0].t < now - 2) rateWindow.shift();
    if (rateWindow.length > 1){
      const a = rateWindow[0], b = rateWindow[rateWindow.length - 1];
      if (b.t - a.t > 0.05) rateText.textContent = ((b.c - a.c) / (b.t - a.t)).toFixed(1);
    }
  }
}

/* ================= Controls ================= */
let coreGlow = 1.59;  // multiplier for core glow (live)
let pointGlow = 0.9;  // multiplier for point brightness (live)
function bindSlider(input, label, fn){
  input.addEventListener('input', () => {
    const v = parseFloat(input.value);
    label.textContent = v.toFixed(2);
    fn(v);
  });
}
bindSlider(document.getElementById('ctlStrength'),  document.getElementById('valStrength'),  v => { bloomPass.strength = v; });
bindSlider(document.getElementById('ctlRadius'),    document.getElementById('valRadius'),    v => { bloomPass.radius = v; });
bindSlider(document.getElementById('ctlThreshold'), document.getElementById('valThreshold'), v => { bloomPass.threshold = v; });
bindSlider(document.getElementById('ctlExposure'),  document.getElementById('valExposure'),  v => { renderer.toneMappingExposure = v; });
bindSlider(document.getElementById('ctlCoreGlow'),  document.getElementById('valCoreGlow'),  v => { coreGlow = v; });
bindSlider(document.getElementById('ctlPointGlow'), document.getElementById('valPointGlow'), v => { pointGlow = v; pointMat.uniforms.uGlow.value = v; });
document.getElementById('controlsToggle').addEventListener('click', () => {
  const body = document.getElementById('controlsBody');
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? 'block' : 'none';
  document.getElementById('controlsToggle').textContent = hidden ? '\u2212' : '+';
});

/* ================= Download-Button ================= */
const restartBtn = document.getElementById('restartBtn');
restartBtn.addEventListener('click', () => {
  // Comment & Upload starten (Kugeln bleiben auf der sortierten Kugel)
  if (phase === PHASE_COMPLETE){
    docStart = performance.now() / 1000;
    docIndex = 0;
    docsFinished = false;
    phase = PHASE_DOCS;
    return;
  }
  if (phase !== PHASE_IDLE && !(phase === PHASE_DOCS && docsFinished)) return; // laeuft schon
  scatterPositions();
  pickFails();
  downloadOrder = shuffle([...Array(TOTAL).keys()]);
  pullStart.fill(-1);
  explodeDelay.fill(0);
  scanned.fill(false);
  impactDone.fill(false);
  explodeInitialized = false;
  if (shockwave){
    scene.remove(shockwave);
    shockwave.geometry.dispose();
    shockwave.material.dispose();
    shockwave = null;
  }
  for (let i = 0; i < pulseRings.length; i++){
    scene.remove(pulseRings[i].line);
    pulseRings[i].line.geometry.dispose();
    pulseRings[i].line.material.dispose();
  }
  pulseRings.length = 0;
  lastPulseRing = 0;
  colorAnims.clear();
  for (let i = 0; i < TOTAL; i++){
    pointField.setColorAt(i, COLOR_GRAY);
    setInstance(i, randomPositions[i], 0);
  }
  pointField.instanceColor.needsUpdate = true;
  pointField.instanceMatrix.needsUpdate = true;
  particles.length = 0;
  freeSlots.length = 0;
  slotCount = 0;
  pGeo.setDrawRange(0, 0);
  rateWindow.length = 0;
  downloadedCount = 0;
  foundCount = 0;
  docIndex = 0;
  docsFinished = false;
  appearFinished = false;
  phase = PHASE_SCAN;
  resetTimers();
  core.scale.setScalar(1);
  coreMat.uniforms.uGlow.value = coreGlow;
  coreLight.intensity = CORE_LIGHT_BASE * coreGlow;
});

/* ================= Main loop ================= */
let lastFrame = performance.now();
function animate(nowMs){
  requestAnimationFrame(animate);
  timeNow = nowMs / 1000;
  const dt = Math.min((nowMs - lastFrame) / 1000, 0.1);
  lastFrame = nowMs;

  if (phase !== PHASE_IDLE && phase !== PHASE_DOCS) phase = computePhase(timeNow);

  updateScan(timeNow);
  updateDownloads(timeNow);
  if (phase === PHASE_EXPLODE || phase === PHASE_COMPLETE) initExplosion();
  updatePointTransforms(timeNow);
  updateColorAnims(timeNow);
  updateCore(timeNow);
  updateProcessingParticles(timeNow);
  updatePulseRings(timeNow);
  updateScanBand(timeNow);
  updateAnalyzers(dt);
  updateFloatTexts(timeNow);
  updateImpactWaves(timeNow);
  updateDocs(timeNow);
  updateParticles(dt);
  updateShockwave(timeNow);
  updateHover(timeNow);
  updateHUD(timeNow);

  stars.rotation.y += dt * 0.008;
  holoOuter.rotation.y += dt * 0.03;
  holoOuter.rotation.x += dt * 0.012;
  holoInner.rotation.y += dt * 0.12;
  holoInner.rotation.x += dt * 0.04;
  orbit1.rotation.y += dt * 0.4;
  orbit2.rotation.y -= dt * 0.3;
  orbit3.rotation.y += dt * 0.25;
  shieldPanel.rotation.y -= dt * 0.3; // counter-rotating -> facet shimmer
  shieldPanel.rotation.x += dt * 0.08;
  controls.update();
  composer.render();
}
requestAnimationFrame(animate);

/* ================= Resize ================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.setSize(innerWidth, innerHeight);
});
</script>
